name: Build and Release MaazCraft APK

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable (if present)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Android APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Rename APK for Release
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/*.apk release_apks/MaazCraft-Launcher-V3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaazCraft-Launcher-V3-APK
          path: release_apks/MaazCraft-Launcher-V3.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest-build
          name: "MaazCraft Launcher V3 (Latest Release)"
          body: "Automatic build of MaazCraft Launcher V3 for Android (Zalith Engine). Direct APK attached below."
          files: release_apks/MaazCraft-Launcher-V3.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
