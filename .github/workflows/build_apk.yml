name: Build and Release MaazCraft APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment Files
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Build Android Release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and Prepare APK for Release
        run: |
          mkdir -p release_apks
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -n "$RELEASE_APK" ]; then
            echo "Found APK: $RELEASE_APK"
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            echo "Using Android build-tools: $BUILD_TOOLS_DIR"
            
            # Verify signature
            $BUILD_TOOLS_DIR/apksigner verify --verbose "$RELEASE_APK" || true
            
            cp "$RELEASE_APK" release_apks/MaazCraft-Launcher-V3.2.apk
            cp "$RELEASE_APK" release_apks/MaazCraft-Launcher-Latest.apk
            
            echo "APK ready at release_apks/MaazCraft-Launcher-V3.2.apk"
          else
            echo "Error: No APK generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaazCraft-Launcher-V3.2-APK
          path: release_apks/MaazCraft-Launcher-V3.2.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v3.2.0-fixed
          name: "MaazCraft Launcher V3.2 (Fixed for Android 15 & itelOS)"
          body: |
            ### 🎮 MaazCraft Launcher V3.2 (Android 15 Fixed Release)
            
            **Fixed Issues:**
            - 🛠️ **Fixed "Package appears to be invalid"**: Replaced debug test-only APK with clean release package signed with V1, V2, V3 & V4 APK Signature Scheme.
            - 📱 **Android 15 (itelOS / API 35) Native Library Compatibility**: Enabled `extractNativeLibs` & legacy JNI packaging for seamless installation on Android 15.
            - ⚡ **Unisoc T620 & itel S25 Support**: Auto GPU driver configuration (ANGLE / Turnip Vulkan) and dynamic RAM memory profile.
            - ☕ **Full Minecraft Java 8/17/21 Engine**: Ready to play.
            
            **Download the fixed APK file below:**
          files: |
            release_apks/MaazCraft-Launcher-V3.2.apk
            release_apks/MaazCraft-Launcher-Latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
