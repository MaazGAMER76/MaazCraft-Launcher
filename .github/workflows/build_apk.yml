name: Build and Release MaazCraft APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment Files
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Build Android APK
        run: |
          gradle :app:assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Find and Prepare APK for Release
        run: |
          mkdir -p release_apks
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release_apks/MaazCraft-Launcher-V3.apk
            echo "APK found and copied: $APK_PATH"
          else
            echo "Error: No APK generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaazCraft-Launcher-V3-APK
          path: release_apks/MaazCraft-Launcher-V3.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest-build
          name: "MaazCraft Launcher V3 (Latest Release)"
          body: "Automatic build of MaazCraft Launcher V3 for Android (Zalith Engine). Direct APK attached below."
          files: release_apks/MaazCraft-Launcher-V3.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
