name: Build and Release MaazCraft APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment Files
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Build Android APK
        run: |
          gradle :app:assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Find, Align and Sign APK for Release
        run: |
          mkdir -p release_apks
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -n "$RAW_APK" ]; then
            echo "Found raw APK: $RAW_APK"
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            echo "Using Android build-tools: $BUILD_TOOLS_DIR"
            
            # Align and sign with v2/v3 signature
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" release_apks/aligned.apk || cp "$RAW_APK" release_apks/aligned.apk
            $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out release_apks/MaazCraft-Launcher-V3.1.apk release_apks/aligned.apk || cp "$RAW_APK" release_apks/MaazCraft-Launcher-V3.1.apk
            
            # Also keep a copy as MaazCraft-Launcher.apk
            cp release_apks/MaazCraft-Launcher-V3.1.apk release_apks/MaazCraft-Launcher-Latest.apk
            
            echo "APK ready at release_apks/MaazCraft-Launcher-V3.1.apk"
          else
            echo "Error: No APK generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaazCraft-Launcher-V3.1-APK
          path: release_apks/MaazCraft-Launcher-V3.1.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v3.1.0-fixed
          name: "MaazCraft Launcher V3.1 (Fixed & MobileGlues Optimized)"
          body: |
            ### 🎮 MaazCraft Launcher V3.1 (Latest Release)
            
            **What's New in this Fix:**
            - 🛠️ **Fixed Package Invalid Error**: Resolved Android package installer error with standard targetSdk 34 + proper v2/v3 APK signing & alignment.
            - ⚡ **MobileGlues & Mesa Turnip Vulkan Engine**: Real OpenGL 4.6 translation on mobile GPUs for desktop Minecraft Java.
            - 🔍 **Auto Hardware Profiling**: Analyzes RAM, CPU cores, and GPU to inject optimal `options.txt` and `-Xmx` RAM flags.
            - ☕ **Multi-Java Support**: Auto-configured OpenJDK 8, 17, and 21 ARM64.
            
            **Download the APK file attached below:**
          files: |
            release_apks/MaazCraft-Launcher-V3.1.apk
            release_apks/MaazCraft-Launcher-Latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
